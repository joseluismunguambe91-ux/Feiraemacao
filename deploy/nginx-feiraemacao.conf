# Nginx — Sistema de Gestão de Feira Gastronómica e Cultural Escolar
# Copiar para /etc/nginx/sites-available/feiraemacao no servidor.
# Domínio ativo: meunegociomz.com — depois de correr o Certbot (ver
# docs/11-deploy-producao.md, secção 12), este ficheiro ganha automaticamente
# um segundo "server{}" para a porta 443 (HTTPS) com os certificados.

server {
    listen 80;
    listen [::]:80;
    server_name meunegociomz.com www.meunegociomz.com 139.59.137.26;

    root /var/www/feiraemacao/public;
    index index.php;

    client_max_body_size 20M;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    access_log /var/log/nginx/feiraemacao-access.log;
    error_log /var/log/nginx/feiraemacao-error.log;
}
