# Nginx — Sistema de Gestão de Feira Gastronómica e Cultural Escolar
# Copiar para /etc/nginx/sites-available/feiraemacao no servidor.
# Sem domínio por agora: server_name usa o IP da Droplet.
# Quando tiver um domínio, trocar server_name e correr o Certbot (ver docs/11-deploy-producao.md).

server {
    listen 80;
    listen [::]:80;
    server_name 139.59.137.26;

    root /var/www/feiraemacao/public;
    index index.php;

    client_max_body_size 20M;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    access_log /var/log/nginx/feiraemacao-access.log;
    error_log /var/log/nginx/feiraemacao-error.log;
}
